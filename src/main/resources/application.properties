spring.application.name=media-factory
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB
server.tomcat.max-part-count=100
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10m
media-factory.preflight.enabled=true

spring.datasource.url=jdbc:sqlite:media-factory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

media-factory.work-dir=media-factory-work
media-factory.worker.enabled=true
media-factory.worker.poll-interval-ms=1000
media-factory.worker.output-frame-rate=2
media-factory.worker.progress-persist-seconds=3
media-factory.worker.shutdown-await=PT10M
